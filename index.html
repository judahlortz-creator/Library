<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Library Catalogue</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-alt: #f1f5f9;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success-bg: #dcfce7;
      --success-text: #166534;
      --warn-bg: #fef3c7;
      --warn-text: #92400e;
      --danger-bg: #fee2e2;
      --danger-text: #991b1b;
      --rent-bg: #e0e7ff;
      --rent-text: #3730a3;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    body.dark {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-alt: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --success-bg: #064e3b;
      --success-text: #a7f3d0;
      --warn-bg: #78350f;
      --warn-text: #fde68a;
      --danger-bg: #7f1d1d;
      --danger-text: #fecaca;
      --rent-bg: #312e81;
      --rent-text: #c7d2fe;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; padding-bottom: 4rem; }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .brand { display: flex; align-items: center; gap: 0.75rem; }
    .brand h1 { font-size: 1.35rem; font-weight: 700; }
    .role-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      background: var(--surface-alt);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .role-badge.owner { background: var(--primary); color: #fff; border-color: var(--primary); }

    .header-actions { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.15s;
    }
    button:hover { background: var(--surface-alt); }
    button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    button.primary:hover { background: var(--primary-hover); }
    button.danger { background: var(--danger-bg); color: var(--danger-text); border-color: transparent; }
    button.success { background: var(--success-bg); color: var(--success-text); border-color: transparent; }

    .notif-pill {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .badge-count {
      background: #ef4444;
      color: white;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
    }

    main { max-width: 1150px; margin: 1.5rem auto; padding: 0 1.25rem; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .controls input, .controls select {
      padding: 0.65rem 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.95rem;
    }
    .controls input { flex: 1; min-width: 220px; }

    .owner-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 2rem;
      box-shadow: var(--shadow);
      display: none;
    }
    .owner-panel.active { display: block; }
    .tabs { display: flex; gap: 0.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .tab-btn { border: none; background: transparent; padding: 0.45rem 0.85rem; border-radius: 6px; font-weight: 600; color: var(--text-muted); }
    .tab-btn.active { background: var(--primary); color: #fff; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
      gap: 1.25rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
      transition: transform 0.15s;
    }
    .card:hover { transform: translateY(-2px); }
    .cover {
      height: 190px;
      background: #1e293b;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1rem;
      font-weight: 700;
      font-size: 1.1rem;
      position: relative;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      cursor: pointer;
    }
    .cover-overlay {
      background: rgba(15, 23, 42, 0.65);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      backdrop-filter: blur(2px);
    }
    .photo-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      font-size: 0.7rem;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
    }

    .card-body { padding: 1rem; flex: 1; display: flex; flex-direction: column; gap: 0.45rem; }
    .card-title { font-size: 1.05rem; font-weight: 700; line-height: 1.3; cursor: pointer; }
    .card-title:hover { color: var(--primary); }
    .card-author { font-size: 0.85rem; color: var(--text-muted); }
    .card-meta { font-size: 0.76rem; color: var(--text-muted); }
    .card-desc-snippet {
      font-size: 0.84rem;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 0.15rem;
      line-height: 1.4;
    }
    .rating-summary {
      font-size: 0.82rem;
      font-weight: 600;
      color: #d97706;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    body.dark .rating-summary { color: #fbbf24; }
    .badges { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.3rem; }
    .tag { font-size: 0.75rem; font-weight: 600; padding: 0.2rem 0.55rem; border-radius: 6px; }
    .tag.available { background: var(--success-bg); color: var(--success-text); }
    .tag.borrowed { background: var(--danger-bg); color: var(--danger-text); }
    .tag.rent { background: var(--rent-bg); color: var(--rent-text); }
    .tag.free { background: var(--surface-alt); color: var(--text-muted); }
    .card-footer { padding: 0.85rem 1rem; border-top: 1px solid var(--border); display: flex; gap: 0.45rem; flex-wrap: wrap; }
    .card-footer button.main-btn { flex: 1; min-width: 120px; }

    .list-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.9rem;
      margin-bottom: 0.75rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      background: var(--bg);
    }
    .overdue-alert {
      border-left: 4px solid #ef4444;
      background: var(--danger-bg);
      color: var(--danger-text);
    }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55);
      display: none; align-items: center; justify-content: center; padding: 1rem; z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 560px;
      padding: 1.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal h2 { font-size: 1.25rem; margin-bottom: 0.35rem; }
    .modal p.sub { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1rem; }
    .form-group { margin-bottom: 0.9rem; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 0.3rem; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 0.6rem 0.75rem; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.9rem;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 1.25rem; }
    .helper-text { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.25rem; }

    .detail-desc {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem;
      font-size: 0.92rem;
      line-height: 1.55;
      white-space: pre-wrap;
      margin-bottom: 1.25rem;
    }
    .review-box {
      border-top: 1px solid var(--border);
      padding-top: 1rem;
      margin-top: 1rem;
    }
    .review-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      margin-bottom: 0.65rem;
    }
    .review-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      margin-bottom: 0.3rem;
    }
    .verified-pill {
      background: var(--success-bg);
      color: var(--success-text);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.12rem 0.45rem;
      border-radius: 999px;
      margin-left: 0.35rem;
    }

    .gallery-preview {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }
    .thumb-wrap {
      position: relative;
      width: 70px;
      height: 70px;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid var(--border);
    }
    .thumb-wrap.cover-thumb { border-color: var(--primary); }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-actions {
      position: absolute; inset: 0; background: rgba(0,0,0,0.6);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      opacity: 0; transition: opacity 0.15s; gap: 2px;
    }
    .thumb-wrap:hover .thumb-actions { opacity: 1; }
    .thumb-actions button { font-size: 0.6rem; padding: 0.1rem 0.3rem; background: #fff; color: #000; border: none; border-radius: 3px; }

    .main-gallery {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
    }
    .main-gallery img {
      height: 220px;
      border-radius: 8px;
      border: 1px solid var(--border);
      object-fit: contain;
      background: #1e293b;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <h1>📚 Personal Library</h1>
    <span id="roleBadge" class="role-badge">Visitor View</span>
  </div>
  <div class="header-actions">
    <button id="notifBtn" class="notif-pill" style="display:none;" onclick="openOwnerTab('requestsTab')">
      🔔 Alerts <span id="alertCount" class="badge-count">0</span>
    </button>
    <button onclick="toggleDarkMode()">🌓 Theme</button>
    <button id="ownerToggleBtn" onclick="handleOwnerToggle()">🔒 Owner Login</button>
  </div>
</header>

<main>
  <section id="ownerPanel" class="owner-panel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem; flex-wrap:wrap; gap:0.5rem;">
      <h2>Owner Control Panel</h2>
      <div style="display:flex; gap:0.5rem;">
        <button class="primary" onclick="openBookModal()">+ Add Book</button>
        <button onclick="openSettingsModal()">⚙️ Settings & Email</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="requestsTab" onclick="openOwnerTab('requestsTab')">
        Borrow Requests (<span id="reqTabCount">0</span>)
      </button>
      <button class="tab-btn" data-tab="loansTab" onclick="openOwnerTab('loansTab')">
        Active Loans & Due Dates (<span id="loanTabCount">0</span>)
      </button>
    </div>

    <div id="requestsTab" class="tab-content active">
      <div id="requestsList"></div>
    </div>
    <div id="loansTab" class="tab-content">
      <div id="loansList"></div>
    </div>
  </section>

  <!-- SEARCH & FILTERS -->
  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search by title, author, ISBN, category, or description..." oninput="renderBooks()" />
    <select id="statusFilter" onchange="renderBooks()">
      <option value="all">All Books</option>
      <option value="available">Available Now</option>
      <option value="borrowed">Currently Borrowed</option>
      <option value="free">Free to Borrow</option>
      <option value="paid">Paid Rental</option>
    </select>
  </div>

  <div id="bookGrid" class="grid"></div>
</main>

<!-- BOOK DETAILS & REVIEWS MODAL -->
<div id="detailsModal" class="modal-backdrop">
  <div class="modal">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:0.5rem;">
      <div>
        <h2 id="detTitle"></h2>
        <p id="detMeta" class="sub" style="margin-bottom:0.5rem;"></p>
      </div>
      <button onclick="closeModal('detailsModal')" style="padding:0.3rem 0.65rem;">✕</button>
    </div>

    <div id="detGallery" class="main-gallery"></div>
    <div id="detBadges" class="badges" style="margin-bottom:0.85rem;"></div>

    <label style="display:block; font-size:0.8rem; font-weight:700; text-transform:uppercase; color:var(--text-muted); margin-bottom:0.35rem;">About This Book</label>
    <div id="detDescription" class="detail-desc"></div>

    <div class="review-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem;">
        <h3 style="font-size:1.05rem;">Borrower Reviews (<span id="detReviewCount">0</span>)</h3>
        <span id="detAvgRating" class="rating-summary"></span>
      </div>

      <div id="detReviewsList" style="margin-bottom:1rem;"></div>

      <div style="background:var(--surface-alt); padding:0.9rem; border-radius:8px;">
        <h4 style="font-size:0.92rem; margin-bottom:0.25rem;">Leave a Review</h4>
        <form id="reviewForm" onsubmit="submitReview(event)">
          <input type="hidden" id="revBookId" />
          <div class="form-group">
            <label>Your Name *</label>
            <input type="text" id="revName" required placeholder="e.g., Alex Smith" />
          </div>
          <div class="form-group">
            <label>Phone Number *</label>
            <input type="tel" id="revPhone" required placeholder="e.g., (208) 555-0192" />
          </div>
          <div class="form-group">
            <label>Rating *</label>
            <select id="revRating" required>
              <option value="5">★★★★★ (5/5 - Amazing)</option>
              <option value="4">★★★★☆ (4/5 - Great)</option>
              <option value="3">★★★☆☆ (3/5 - Good)</option>
              <option value="2">★★☆☆☆ (2/5 - Fair)</option>
              <option value="1">★☆☆☆☆ (1/5 - Poor)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Your Review *</label>
            <textarea id="revComment" rows="3" required placeholder="Share your thoughts..."></textarea>
          </div>
          <button type="submit" class="primary" style="width:100%;">Post Verified Review</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- BORROW REQUEST MODAL -->
<div id="requestModal" class="modal-backdrop">
  <div class="modal">
    <h2>Request to Borrow</h2>
    <p id="reqBookSummary" class="sub"></p>
    <form id="borrowRequestForm" onsubmit="submitBorrowRequest(event)">
      <input type="hidden" id="reqBookId" />
      <div class="form-group">
        <label>Your Name *</label>
        <input type="text" id="visitorName" required placeholder="e.g., Alex Smith" />
      </div>
      <div class="form-group">
        <label>Phone Number *</label>
        <input type="tel" id="visitorPhone" required placeholder="e.g., (208) 555-0192" />
      </div>
      <div class="form-group">
        <label>Notes / Duration</label>
        <textarea id="visitorNotes" rows="3" placeholder="Hoping to borrow for 2 weeks..."></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" onclick="closeModal('requestModal')">Cancel</button>
        <button type="submit" class="primary">Send Borrow Request</button>
      </div>
    </form>
  </div>
</div>

<!-- APPROVE MODAL -->
<div id="approveModal" class="modal-backdrop">
  <div class="modal">
    <h2>Approve Borrow Request</h2>
    <p id="approveSummary" class="sub"></p>
    <form onsubmit="confirmApproval(event)">
      <input type="hidden" id="approveReqId" />
      <div class="form-group">
        <label>Return Due Date *</label>
        <input type="date" id="approveDueDate" required />
      </div>
      <div class="modal-actions">
        <button type="button" onclick="closeModal('approveModal')">Cancel</button>
        <button type="submit" class="success">Confirm & Mark Borrowed</button>
      </div>
    </form>
  </div>
</div>

<!-- ADD / EDIT BOOK MODAL -->
<div id="bookModal" class="modal-backdrop">
  <div class="modal">
    <h2 id="bookModalTitle">Add Book</h2>
    <form onsubmit="saveBook(event)">
      <input type="hidden" id="editBookId" />
      <div class="form-group">
        <label>Book Title *</label>
        <input type="text" id="bookTitle" required />
      </div>
      <div class="form-group">
        <label>Author *</label>
        <input type="text" id="bookAuthor" required />
      </div>
      <div class="form-group">
        <label>ISBN</label>
        <input type="text" id="bookIsbn" placeholder="e.g., 978-0593420232" />
      </div>
      <div class="form-group">
        <label>Category / Genre</label>
        <input type="text" id="bookCategory" placeholder="Theology, Fiction, History" />
      </div>
      <div class="form-group">
        <label>Date Catalogued *</label>
        <input type="date" id="bookDateCatalogued" required />
      </div>
      <div class="form-group">
        <label>Description / Summary</label>
        <textarea id="bookDescription" rows="3" placeholder="Summary or condition notes..."></textarea>
      </div>

      <!-- MULTI-PHOTO UPLOAD & CROP -->
      <div class="form-group">
        <label>Book Photos (Add Multiple)</label>
        <input type="file" id="bookImageInput" accept="image/*" onchange="handleImageSelection(event)" />
        <div class="helper-text">Choose from gallery or camera. Primary photo has a blue border.</div>
        <div id="imageGalleryPreview" class="gallery-preview"></div>
      </div>

      <div class="form-group">
        <label>Borrow Cost ($ USD — 0 for Free)</label>
        <input type="number" id="bookCost" min="0" step="0.50" value="0" required />
      </div>
      <div class="form-group">
        <label>Rental Term</label>
        <input type="text" id="bookTerm" value="for 2 weeks" />
      </div>
      <div class="modal-actions">
        <button type="button" onclick="closeModal('bookModal')">Cancel</button>
        <button type="submit" class="primary" id="saveBookBtn">Save Book</button>
      </div>
    </form>
  </div>
</div>

<!-- IMAGE CROPPER MODAL -->
<div id="cropModal" class="modal-backdrop" style="z-index: 60;">
  <div class="modal" style="max-width: 420px; text-align: center;">
    <h2>Crop Photo</h2>
    <p class="sub">Drag to adjust framing.</p>
    <div style="margin: 1rem 0; background: #1e293b; padding: 1rem; border-radius: 8px;">
      <canvas id="cropCanvas" style="max-width: 100%; height: 260px; object-fit: contain; cursor: crosshair;"></canvas>
    </div>
    <div class="modal-actions" style="justify-content: center;">
      <button type="button" onclick="closeModal('cropModal')">Cancel</button>
      <button type="button" class="primary" onclick="confirmCrop()">Apply Crop & Add</button>
    </div>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div id="settingsModal" class="modal-backdrop">
  <div class="modal">
    <h2>Owner Settings</h2>
    <form onsubmit="saveSettings(event)">
      <div class="form-group">
        <label>Owner PIN</label>
        <input type="password" id="settingPin" required />
      </div>
      <div class="form-group">
        <label>Formspree Endpoint URL (For Email Notifications)</label>
        <input type="url" id="settingFormspree" placeholder="https://formspree.io/f/yourFormID" />
      </div>
      <div class="modal-actions">
        <button type="button" onclick="closeModal('settingsModal')">Cancel</button>
        <button type="submit" class="primary">Save Settings</button>
      </div>
    </form>
  </div>
</div>

    books: [],
    requests: []
  };

  let isOwner = false;
  let currentEditingImages = [];
  let tempCropImageObj = null;
  let cropCanvasCtx = null;
  let cropZoom = 1;
  let cropOffsetX = 0;
  let cropOffsetY = 0;
  let isDragging = false;
  let startX = 0, startY = 0;

  function initData() {
    if (isFirebaseEnabled) {
      // 1. Listen to individual book documents in 'books' collection
      db.collection("books").onSnapshot(snapshot => {
        const list = [];
        snapshot.forEach(doc => list.push(doc.data()));
        
        // Auto-migrate legacy single-document books if 'books' collection is empty
        if (list.length === 0) {
          db.collection("library").doc("books").get().then(legacyDoc => {
            if (legacyDoc.exists && legacyDoc.data().items && legacyDoc.data().items.length > 0) {
              legacyDoc.data().items.forEach(item => {
                db.collection("books").doc(item.id).set(item);
              });
            }
          });
        } else {
          state.books = list;
          renderBooks();
          updateNotifications();
          if (isOwner) renderLoans();
        }
      }, err => console.error("Books listener error:", err));

      // 2. Requests
      db.collection("library").doc("requests").onSnapshot(doc => {
        if (doc.exists && doc.data().items) {
          state.requests = doc.data().items;
          updateNotifications();
          if (isOwner) renderRequests();
        }
      });

      // 3. Settings
      db.collection("library").doc("settings").onSnapshot(doc => {
        if (doc.exists && doc.data()) state.settings = doc.data();
      });
    } else {
      const local = localStorage.getItem("personal_library_cloud_v2");
      if (local) { try { state = JSON.parse(local); } catch(e){} }
      renderBooks();
      updateNotifications();
    }
  }

  async function saveSingleBookToCloud(bookObj) {
    if (isFirebaseEnabled) {
      try {
        await db.collection("books").doc(bookObj.id).set(bookObj);
      } catch (err) {
        alert("Failed to save book to cloud: " + err.message + "\nTry removing a photo or making photos smaller.");
        throw err;
      }
    } else {
      localStorage.setItem("personal_library_cloud_v2", JSON.stringify(state));
      renderBooks();
      if (isOwner) { renderLoans(); renderRequests(); }
    }
  }

  async function deleteSingleBookFromCloud(bookId) {
    if (isFirebaseEnabled) {
      await db.collection("books").doc(bookId).delete();
    } else {
      localStorage.setItem("personal_library_cloud_v2", JSON.stringify(state));
      renderBooks();
    }
  }

  function saveRequestsToCloud() {
    if (isFirebaseEnabled) db.collection("library").doc("requests").set({ items: state.requests });
    else localStorage.setItem("personal_library_cloud_v2", JSON.stringify(state));
  }
  function saveSettingsToCloud() {
    if (isFirebaseEnabled) db.collection("library").doc("settings").set(state.settings);
    else localStorage.setItem("personal_library_cloud_v2", JSON.stringify(state));
  }

  function toggleDarkMode() {
    document.body.classList.toggle("dark");
    localStorage.setItem("library_dark", document.body.classList.contains("dark"));
  }
  if (localStorage.getItem("library_dark") === "true") document.body.classList.add("dark");

  function handleOwnerToggle() {
    if (isOwner) {
      isOwner = false;
      document.getElementById("ownerPanel").classList.remove("active");
      document.getElementById("roleBadge").textContent = "Visitor View";
      document.getElementById("roleBadge").classList.remove("owner");
      document.getElementById("ownerToggleBtn").textContent = "🔒 Owner Login";
      document.getElementById("notifBtn").style.display = "none";
      renderBooks();
      return;
    }
    const entered = prompt("Enter Owner PIN:");
    if (entered === state.settings.pin) {
      isOwner = true;
      document.getElementById("ownerPanel").classList.add("active");
      document.getElementById("roleBadge").textContent = "Owner Mode";
      document.getElementById("roleBadge").classList.add("owner");
      document.getElementById("ownerToggleBtn").textContent = "🚪 Exit Owner Mode";
      document.getElementById("notifBtn").style.display = "inline-flex";
      updateNotifications();
      renderRequests();
      renderLoans();
      renderBooks();
    } else if (entered !== null) alert("Incorrect PIN.");
  }

  function openOwnerTab(tabId) {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
    document.querySelector(`[data-tab="${tabId}"]`).classList.add("active");
    document.getElementById(tabId).classList.add("active");
  }

  function updateNotifications() {
    const pendingCount = state.requests.length;
    const overdueCount = state.books.filter(b => b.status === "borrowed" && b.borrower && b.borrower.dueDate <= new Date().toISOString().split("T")[0]).length;
    document.getElementById("alertCount").textContent = pendingCount + overdueCount;
    document.getElementById("reqTabCount").textContent = pendingCount;
    document.getElementById("loanTabCount").textContent = state.books.filter(b => b.status === "borrowed").length;
  }

  function formatStars(rating) {
    const r = Math.round(Number(rating));
    return "★".repeat(r) + "☆".repeat(5 - r);
  }
  function getAverageRating(book) {
    if (!book.reviews || book.reviews.length === 0) return null;
    const sum = book.reviews.reduce((acc, r) => acc + Number(r.rating), 0);
    return (sum / book.reviews.length).toFixed(1);
  }

  function renderBooks() {
    const grid = document.getElementById("bookGrid");
    const rawQuery = document.getElementById("searchInput").value.toLowerCase();
    const cleanQuery = rawQuery.replace(/[-\s]/g, "");
    const filter = document.getElementById("statusFilter").value;

    const filtered = state.books.filter(book => {
      const titleMatch = book.title.toLowerCase().includes(rawQuery);
      const authorMatch = book.author.toLowerCase().includes(rawQuery);
      const categoryMatch = book.category && book.category.toLowerCase().includes(rawQuery);
      const descMatch = book.description && book.description.toLowerCase().includes(rawQuery);
      const isbnClean = (book.isbn || "").toLowerCase().replace(/[-\s]/g, "");
      const isbnMatch = cleanQuery && isbnClean && isbnClean.includes(cleanQuery);

      const matchesText = titleMatch || authorMatch || categoryMatch || descMatch || isbnMatch;
      if (!matchesText) return false;
      if (filter === "available") return book.status === "available";
      if (filter === "borrowed") return book.status === "borrowed";
      if (filter === "free") return Number(book.cost) === 0;
      if (filter === "paid") return Number(book.cost) > 0;
      return true;
    });

    if (filtered.length === 0) {
      grid.innerHTML = `<p style="color:var(--text-muted);">No matching books found.</p>`;
      return;
    }

    grid.innerHTML = filtered.map(book => {
      const isBorrowed = book.status === "borrowed";
      const costNum = Number(book.cost);
      const priceLabel = costNum > 0 ? `$${costNum} (${book.term})` : "Free to borrow";
      
      let images = book.images || (book.cover ? [book.cover] : []);
      let coverImg = images.length > 0 ? images[0] : "";
      let coverStyle = coverImg ? `background-image: url('${coverImg}');` : "";
      const avg = getAverageRating(book);
      const revCount = book.reviews ? book.reviews.length : 0;

      return `
        <div class="card">
          <div class="cover" style="${coverStyle}" onclick="openDetailsModal('${book.id}')">
            ${!coverImg ? `<div class="cover-overlay">${book.title}</div>` : ""}
            ${images.length > 1 ? `<span class="photo-badge">📷 ${images.length} photos</span>` : ""}
          </div>
          <div class="card-body">
            <div class="card-title" onclick="openDetailsModal('${book.id}')">${book.title}</div>
            <div class="card-author">by ${book.author} ${book.category ? `• ${book.category}` : ""}</div>
            <div class="card-meta">
              Catalogued: ${book.dateCatalogued || "N/A"} 
              ${book.isbn ? `• ISBN: ${book.isbn}` : ""}
            </div>
            <div class="rating-summary">
              ${avg ? `${formatStars(avg)} ${avg} (${revCount})` : `<span style="color:var(--text-muted); font-weight:400;">No reviews yet</span>`}
            </div>
            ${book.description ? `<div class="card-desc-snippet">${book.description}</div>` : ""}
            <div class="badges">
              <span class="tag ${isBorrowed ? "borrowed" : "available"}">${isBorrowed ? "Borrowed" : "Available"}</span>
              <span class="tag ${costNum > 0 ? "rent" : "free"}">${priceLabel}</span>
            </div>
          </div>
          <div class="card-footer">
            ${isBorrowed ? `<button class="main-btn" disabled style="opacity:0.6; cursor:not-allowed;">Borrowed</button>` : `<button class="primary main-btn" onclick="openRequestModal('${book.id}')">Request</button>`}
            <button onclick="openDetailsModal('${book.id}')">📖 Info</button>
            ${isOwner ? `<button onclick="openBookModal('${book.id}')">✏️</button><button class="danger" onclick="deleteBook('${book.id}')">🗑️</button>` : ""}
          </div>
        </div>
      `;
    }).join("");
  }

  function openDetailsModal(bookId) {
    const book = state.books.find(b => b.id === bookId);
    if (!book) return;

    const isBorrowed = book.status === "borrowed";
    const costNum = Number(book.cost);
    const priceLabel = costNum > 0 ? `$${costNum} to borrow ${book.term}` : "Free to borrow";

    document.getElementById("detTitle").textContent = book.title;
    document.getElementById("detMeta").textContent = `by ${book.author}${book.category ? ` • ${book.category}` : ""} ${book.isbn ? `• ISBN: ${book.isbn}` : ""} • Catalogued ${book.dateCatalogued || "N/A"}`;
    document.getElementById("detBadges").innerHTML = `
      <span class="tag ${isBorrowed ? "borrowed" : "available"}">${isBorrowed ? "Borrowed" : "Available"}</span>
      <span class="tag ${costNum > 0 ? "rent" : "free"}">${priceLabel}</span>
    `;
    document.getElementById("detDescription").textContent = book.description || "No description provided.";

    let images = book.images || (book.cover ? [book.cover] : []);
    const galleryEl = document.getElementById("detGallery");
    if (images.length > 0) {
      galleryEl.style.display = "flex";
      galleryEl.innerHTML = images.map(img => `<img src="${img}" alt="Book photo" />`).join("");
    } else {
      galleryEl.style.display = "none";
    }

    document.getElementById("revBookId").value = book.id;
    renderReviewsList(book);
    document.getElementById("detailsModal").classList.add("open");
  }

  function renderReviewsList(book) {
    const reviews = book.reviews || [];
    const avg = getAverageRating(book);
    document.getElementById("detReviewCount").textContent = reviews.length;
    document.getElementById("detAvgRating").textContent = avg ? `${formatStars(avg)} (${avg}/5)` : "";
    document.getElementById("detReviewsList").innerHTML = reviews.length === 0 ? `<p style="color:var(--text-muted); font-size:0.85rem;">No reviews yet.</p>` :
      reviews.map(rev => `
        <div class="review-card">
          <div class="review-header">
            <div><strong>${rev.name}</strong><span class="verified-pill">✓ Verified Borrower</span></div>
            <span style="color:#d97706; font-weight:700;">${formatStars(rev.rating)}</span>
          </div>
          <div style="font-size:0.88rem; margin-bottom:0.25rem;">${rev.comment}</div>
          <div style="font-size:0.74rem; color:var(--text-muted);">${rev.date}</div>
        </div>
      `).join("");
  }

  function normalizePhone(phone) { return (phone || "").replace(/\D/g, ""); }
  async function submitReview(e) {
    e.preventDefault();
    const bookId = document.getElementById("revBookId").value;
    const book = state.books.find(b => b.id === bookId);
    if (!book) return;

    const name = document.getElementById("revName").value.trim();
    const phone = document.getElementById("revPhone").value.trim();
    const rating = Number(document.getElementById("revRating").value);
    const comment = document.getElementById("revComment").value.trim();

    const past = [...(book.borrowHistory || [])];
    if (book.borrower) past.push(book.borrower);

    const isVerified = past.some(r => (r.name || "").toLowerCase() === name.toLowerCase() || normalizePhone(r.phone) === normalizePhone(phone));
    if (!isVerified) {
      alert("Verification failed: Name or phone number does not match an approved borrow record for this book.");
      return;
    }

    if (!Array.isArray(book.reviews)) book.reviews = [];
    book.reviews.unshift({ id: "rev_" + Date.now(), name, rating, comment, date: new Date().toLocaleDateString() });
    await saveSingleBookToCloud(book);
    document.getElementById("reviewForm").reset();
    renderReviewsList(book);
    alert("Review posted successfully!");
  }

  // --- Image Cropping & Multi-Photo Workflow ---
  function handleImageSelection(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(event) {
      const img = new Image();
      img.onload = function() {
        tempCropImageObj = img;
        cropZoom = 1;
        cropOffsetX = 0;
        cropOffsetY = 0;
        openCropModal();
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  }

  function openCropModal() {
    const canvas = document.getElementById("cropCanvas");
    cropCanvasCtx = canvas.getContext("2d");
    // Compact resolution keeps each photo ~25KB so you can store 20+ photos per book easily
    canvas.width = 260;
    canvas.height = 330;
    drawCropPreview();

    canvas.onmousedown = startDrag;
    canvas.onmousemove = duringDrag;
    canvas.onmouseup = endDrag;
    canvas.ontouchstart = (e) => { startDrag(e.touches[0]); };
    canvas.ontouchmove = (e) => { duringDrag(e.touches[0]); };
    canvas.ontouchend = endDrag;

    document.getElementById("cropModal").classList.add("open");
  }

  function startDrag(e) { isDragging = true; startX = e.clientX - cropOffsetX; startY = e.clientY - cropOffsetY; }
  function duringDrag(e) { if (!isDragging) return; cropOffsetX = e.clientX - startX; cropOffsetY = e.clientY - startY; drawCropPreview(); }
  function endDrag() { isDragging = false; }

  function drawCropPreview() {
    const canvas = document.getElementById("cropCanvas");
    cropCanvasCtx.clearRect(0, 0, canvas.width, canvas.height);
    if (!tempCropImageObj) return;

    cropCanvasCtx.save();
    cropCanvasCtx.translate(canvas.width / 2 + cropOffsetX, canvas.height / 2 + cropOffsetY);
    const scale = Math.min(canvas.width / tempCropImageObj.width, canvas.height / tempCropImageObj.height) * cropZoom;
    cropCanvasCtx.drawImage(
      tempCropImageObj,
      -tempCropImageObj.width * scale / 2,
      -tempCropImageObj.height * scale / 2,
      tempCropImageObj.width * scale,
      tempCropImageObj.height * scale
    );
    cropCanvasCtx.restore();
  }

  function confirmCrop() {
    const canvas = document.getElementById("cropCanvas");
    const dataUrl = canvas.toDataURL("image/jpeg", 0.75);
    currentEditingImages.push(dataUrl);
    renderImageGalleryPreview();
    closeModal("cropModal");
  }

  function renderImageGalleryPreview() {
    const container = document.getElementById("imageGalleryPreview");
    container.innerHTML = currentEditingImages.map((img, idx) => `
      <div class="thumb-wrap ${idx === 0 ? 'cover-thumb' : ''}">
        <img src="${img}" alt="Thumbnail" />
        <div class="thumb-actions">
          ${idx !== 0 ? `<button type="button" onclick="setAsCover(${idx})">Make Cover</button>` : `<span style="font-size:0.6rem; color:#ffd700; font-weight:700;">COVER</span>`}
          <button type="button" onclick="removeEditingImage(${idx})" style="background:#fee2e2; color:#991b1b;">Remove</button>
        </div>
      </div>
    `).join("");
  }

  function setAsCover(idx) {
    const img = currentEditingImages.splice(idx, 1)[0];
    currentEditingImages.unshift(img);
    renderImageGalleryPreview();
  }

  function removeEditingImage(idx) {
    currentEditingImages.splice(idx, 1);
    renderImageGalleryPreview();
  }

  function openBookModal(bookId = null) {
    document.getElementById("editBookId").value = bookId || "";
    currentEditingImages = [];
    const todayStr = new Date().toISOString().split("T")[0];

    if (bookId) {
      const book = state.books.find(b => b.id === bookId);
      document.getElementById("bookModalTitle").textContent = "Edit Book";
      document.getElementById("bookTitle").value = book.title;
      document.getElementById("bookAuthor").value = book.author;
      document.getElementById("bookIsbn").value = book.isbn || "";
      document.getElementById("bookCategory").value = book.category || "";
      document.getElementById("bookDateCatalogued").value = book.dateCatalogued || todayStr;
      document.getElementById("bookDescription").value = book.description || "";
      document.getElementById("bookCost").value = book.cost;
      document.getElementById("bookTerm").value = book.term || "for 2 weeks";
      currentEditingImages = book.images ? [...book.images] : (book.cover ? [book.cover] : []);
    } else {
      document.getElementById("bookModalTitle").textContent = "Add New Book";
      document.getElementById("bookTitle").value = "";
      document.getElementById("bookAuthor").value = "";
      document.getElementById("bookIsbn").value = "";
      document.getElementById("bookCategory").value = "";
      document.getElementById("bookDateCatalogued").value = todayStr;
      document.getElementById("bookDescription").value = "";
      document.getElementById("bookCost").value = "0";
      document.getElementById("bookTerm").value = "for 2 weeks";
    }
    renderImageGalleryPreview();
    document.getElementById("bookModal").classList.add("open");
  }

  async function saveBook(e) {
    e.preventDefault();
    const saveBtn = document.getElementById("saveBookBtn");
    saveBtn.disabled = true;
    saveBtn.textContent = "Saving...";

    try {
      const id = document.getElementById("editBookId").value;
      const bookData = {
        title: document.getElementById("bookTitle").value.trim(),
        author: document.getElementById("bookAuthor").value.trim(),
        isbn: document.getElementById("bookIsbn").value.trim(),
        category: document.getElementById("bookCategory").value.trim(),
        dateCatalogued: document.getElementById("bookDateCatalogued").value,
        description: document.getElementById("bookDescription").value.trim(),
        cost: parseFloat(document.getElementById("bookCost").value) || 0,
        term: document.getElementById("bookTerm").value.trim() || "for 2 weeks",
        images: currentEditingImages,
        cover: currentEditingImages.length > 0 ? currentEditingImages[0] : ""
      };

      let targetBook;
      if (id) {
        const idx = state.books.findIndex(b => b.id === id);
        targetBook = { ...state.books[idx], ...bookData };
        state.books[idx] = targetBook;
      } else {
        targetBook = {
          id: "b_" + Date.now(),
          ...bookData,
          status: "available",
          borrower: null,
          borrowHistory: [],
          reviews: []
        };
        state.books.push(targetBook);
      }

      await saveSingleBookToCloud(targetBook);
      closeModal("bookModal");
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = "Save Book";
    }
  }

  async function deleteBook(bookId) {
    if (!confirm("Delete this book?")) return;
    state.books = state.books.filter(b => b.id !== bookId);
    await deleteSingleBookFromCloud(bookId);
  }

  function openRequestModal(bookId) {
    const book = state.books.find(b => b.id === bookId);
    if (!book) return;
    document.getElementById("reqBookId").value = book.id;
    document.getElementById("reqBookSummary").textContent = `"${book.title}" by ${book.author}`;
    document.getElementById("borrowRequestForm").reset();
    document.getElementById("requestModal").classList.add("open");
  }

  async function submitBorrowRequest(e) {
    e.preventDefault();
    const bookId = document.getElementById("reqBookId").value;
    const book = state.books.find(b => b.id === bookId);
    const name = document.getElementById("visitorName").value.trim();
    const phone = document.getElementById("visitorPhone").value.trim();
    const notes = document.getElementById("visitorNotes").value.trim();

    state.requests.push({
      id: "req_" + Date.now(),
      bookId: book.id,
      bookTitle: book.title,
      name, phone, notes,
      submittedAt: new Date().toLocaleDateString()
    });
    saveRequestsToCloud();
    closeModal("requestModal");
    alert("Borrow request submitted successfully!");
  }

  function renderRequests() {
    const container = document.getElementById("requestsList");
    container.innerHTML = state.requests.length === 0 ? `<p style="color:var(--text-muted);">No pending requests.</p>` :
      state.requests.map(req => `
        <div class="list-item">
          <div>
            <strong>${req.bookTitle}</strong>
            <div style="font-size:0.85rem;">Requested by: <strong>${req.name}</strong> (${req.phone})</div>
          </div>
          <div style="display:flex; gap:0.5rem;">
            <button class="success" onclick="openApproveModal('${req.id}')">Approve</button>
            <button class="danger" onclick="denyRequest('${req.id}')">Deny</button>
          </div>
        </div>
      `).join("");
  }

  function openApproveModal(reqId) {
    const req = state.requests.find(r => r.id === reqId);
    if (!req) return;
    document.getElementById("approveReqId").value = req.id;
    document.getElementById("approveSummary").textContent = `Lending "${req.bookTitle}" to ${req.name}`;
    document.getElementById("approveDueDate").value = new Date(Date.now() + 14 * 86400000).toISOString().split("T")[0];
    document.getElementById("approveModal").classList.add("open");
  }

  async function confirmApproval(e) {
    e.preventDefault();
    const reqId = document.getElementById("approveReqId").value;
    const dueDate = document.getElementById("approveDueDate").value;
    const reqIndex = state.requests.findIndex(r => r.id === reqId);
    if (reqIndex === -1) return;

    const req = state.requests[reqIndex];
    const book = state.books.find(b => b.id === req.bookId);
    if (book) {
      const record = { name: req.name, phone: req.phone, notes: req.notes, dueDate, borrowedDate: new Date().toISOString().split("T")[0] };
      book.status = "borrowed";
      book.borrower = record;
      if (!Array.isArray(book.borrowHistory)) book.borrowHistory = [];
      book.borrowHistory.push(record);
      await saveSingleBookToCloud(book);
    }
    state.requests.splice(reqIndex, 1);
    saveRequestsToCloud();
    closeModal("approveModal");
  }

  function denyRequest(reqId) {
    state.requests = state.requests.filter(r => r.id !== reqId);
    saveRequestsToCloud();
  }

  function renderLoans() {
    const container = document.getElementById("loansList");
    const borrowed = state.books.filter(b => b.status === "borrowed");
    container.innerHTML = borrowed.length === 0 ? `<p style="color:var(--text-muted);">No active loans.</p>` :
      borrowed.map(book => `
        <div class="list-item">
          <div>
            <strong>${book.title}</strong>
            <div style="font-size:0.85rem;">Borrower: <strong>${book.borrower.name}</strong> (Due: ${book.borrower.dueDate})</div>
          </div>
          <button class="primary" onclick="markReturned('${book.id}')">Mark Returned</button>
        </div>
      `).join("");
  }

  async function markReturned(bookId) {
    const book = state.books.find(b => b.id === bookId);
    if (!book) return;
    book.status = "available";
    book.borrower = null;
    await saveSingleBookToCloud(book);
  }

  function openSettingsModal() {
    document.getElementById("settingPin").value = state.settings.pin;
    document.getElementById("settingFormspree").value = state.settings.formspreeUrl || "";
    document.getElementById("settingsModal").classList.add("open");
  }
  function saveSettings(e) {
    e.preventDefault();
    state.settings.pin = document.getElementById("settingPin").value.trim() || "1984";
    state.settings.formspreeUrl = document.getElementById("settingFormspree").value.trim();
    saveSettingsToCloud();
    closeModal("settingsModal");
    alert("Settings saved!");
  }

  function closeModal(id) { document.getElementById(id).classList.remove("open"); }

  initData();
</script>
</body>
</html>
